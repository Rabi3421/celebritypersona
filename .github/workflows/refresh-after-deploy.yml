# Refreshes every cached page after a successful Production deploy.
#
# Vercel reports each deploy to GitHub as a deployment; this runs when one of
# those reaches "success" in a Production environment, and never for
# previews. It calls /api/revalidate — the same refresh as running it by hand —
# with CRON_SECRET from the repository's Actions secrets, which must hold the
# same value as CRON_SECRET in Vercel's Production environment.
#
# It can also be run by hand from the Actions tab (Run workflow), for a
# promotion or rollback that did not report a deployment to GitHub.

name: Refresh site after production deploy

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-after-deploy
  cancel-in-progress: false

jobs:
  refresh:
    # Production only. Vercel names the environment "Production" (or
    # "Production – <project>"); previews are "Preview …" and never match.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://www.celebritypersona.com
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check the secret is set
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add CRON_SECRET under Settings → Secrets and variables → Actions (the same value as Vercel Production)."
            exit 1
          fi

      - name: Give the domain a moment to point at the new deployment
        run: sleep 30

      - name: Refresh every page
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o response.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/revalidate")
            echo "Attempt $attempt: HTTP $status"
            cat response.txt; echo
            if [ "$status" = "200" ]; then exit 0; fi
            if [ "$status" = "401" ]; then
              echo "::error::Refused: CRON_SECRET in GitHub does not match CRON_SECRET in Vercel Production."
              exit 1
            fi
            sleep 20
          done
          echo "::error::The refresh did not succeed after 5 attempts."
          exit 1

      - name: Check the sitemap still answers
        run: |
          count=$(curl -sf "$SITE_URL/sitemap.xml" | grep -c "<url>")
          echo "Sitemap lists $count URLs"
          [ "$count" -gt 0 ]
